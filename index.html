<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="YOITES">
  <meta name="robots" content="index,follow">
  <title>YOITES</title>
  <style>
    :root {
      color-scheme: dark;
      --pointer-x: 50%;
      --pointer-y: 50%;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.075), transparent 22rem),
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.035), transparent 24rem),
        #050505;
      color: #f5f5f2;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: repeating-radial-gradient(circle at 20% 30%, transparent 0 1px, rgba(255,255,255,.11) 1px 1.4px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
    }

    main {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: min(92vw, 72rem);
      min-height: 50vh;
      isolation: isolate;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(3.4rem, 12vw, 10.5rem);
      font-weight: 500;
      line-height: .86;
      letter-spacing: .18em;
      text-indent: .18em;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(110deg, #777 0%, #fff 37%, #fff 52%, #858585 76%, #eee 100%);
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 2rem rgba(255,255,255,.08));
      animation: reveal 1.2s cubic-bezier(.16,1,.3,1) both, shimmer 8s ease-in-out 1.2s infinite;
    }

    h1::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -1.4rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.52), transparent);
      transform: scaleX(0);
      animation: line-in 1.4s cubic-bezier(.16,1,.3,1) .45s forwards;
    }

    .scribbles {
      position: fixed;
      inset: -7vmax;
      z-index: 1;
      pointer-events: none;
      opacity: .88;
    }

    .scribble {
      position: absolute;
      display: block;
      width: var(--w);
      height: var(--h);
      border: 1px solid rgba(255,255,255,.18);
      border-left-color: transparent;
      border-bottom-color: rgba(255,255,255,.035);
      border-radius: 48% 52% 44% 56% / 58% 41% 59% 42%;
      transform: rotate(var(--r));
      filter: drop-shadow(0 0 12px rgba(255,255,255,.06));
      animation: drift var(--d) ease-in-out var(--delay) infinite alternate;
    }

    .scribble::before,
    .scribble::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.1);
      border-right-color: transparent;
      border-radius: 50%;
    }

    .scribble::before { inset: 12% -8% -14% 10%; transform: rotate(13deg); }
    .scribble::after { inset: -12% 15% 23% -10%; transform: rotate(-18deg); }

    .s1 { --w: 44vmax; --h: 22vmax; --r: 18deg; --d: 9s; --delay: -2s; top: 2%; left: -12%; }
    .s2 { --w: 36vmax; --h: 17vmax; --r: -32deg; --d: 11s; --delay: -7s; right: -9%; top: 10%; }
    .s3 { --w: 49vmax; --h: 19vmax; --r: 8deg; --d: 13s; --delay: -4s; right: -16%; bottom: -4%; }
    .s4 { --w: 28vmax; --h: 12vmax; --r: -19deg; --d: 10s; --delay: -1s; left: 4%; bottom: 3%; opacity: .62; }

    .halo {
      position: fixed;
      z-index: 0;
      width: min(68vw, 58rem);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.045);
      box-shadow: inset 0 0 8rem rgba(255,255,255,.018), 0 0 9rem rgba(255,255,255,.025);
      animation: breathe 7s ease-in-out infinite;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(1.5rem); filter: blur(12px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0) drop-shadow(0 0 2rem rgba(255,255,255,.08)); }
    }

    @keyframes shimmer { 0%, 100% { background-position: 100% 50%; } 50% { background-position: 0 50%; } }
    @keyframes line-in { to { transform: scaleX(1); } }
    @keyframes drift { to { translate: 1.4rem -1rem; rotate: 3deg; scale: 1.025; } }
    @keyframes breathe { 50% { transform: scale(1.04); opacity: .62; } }

    @media (max-width: 38rem) {
      h1 { font-size: clamp(2.8rem, 16vw, 5rem); letter-spacing: .12em; text-indent: .12em; }
      .halo { width: 100vw; }
      .scribbles { inset: -3vmax; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="halo" aria-hidden="true"></div>
  <div class="scribbles" aria-hidden="true">
    <span class="scribble s1"></span>
    <span class="scribble s2"></span>
    <span class="scribble s3"></span>
    <span class="scribble s4"></span>
  </div>
  <main>
    <h1>YOITES</h1>
  </main>
  <script>
    const root = document.documentElement;
    addEventListener('pointermove', ({ clientX, clientY }) => {
      root.style.setProperty('--pointer-x', `${clientX}px`);
      root.style.setProperty('--pointer-y', `${clientY}px`);
    }, { passive: true });
  </script>
</body>
</html>
