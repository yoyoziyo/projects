<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Encurte links por 10 minutos com a YOITES.">
  <title>Encurtador — YOITES</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#08090b;color:#f4f4f2}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column}
    header,footer{width:min(100% - 40px,1120px);margin:auto;display:flex;align-items:center;justify-content:space-between}
    header{padding:27px 0;border-bottom:1px solid #23252a}footer{padding:25px 0;color:#777b83;font-size:12px}
    .brand{color:#f4f4f2;text-decoration:none;font-weight:800;letter-spacing:.16em;font-size:16px}
    .back{color:#8e9299;text-decoration:none;font-size:13px}.back:hover{color:#fff}
    main{flex:1;width:min(100% - 40px,720px);margin:auto;display:flex;flex-direction:column;justify-content:center;padding:70px 0 100px}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8f949d;margin:0 0 24px}
    h1{font-size:clamp(42px,7vw,74px);letter-spacing:-.065em;line-height:1.02;font-weight:650;margin:0 0 23px}
    .intro{color:#9a9ea5;font-size:17px;line-height:1.55;margin:0 0 52px;max-width:540px}
    label{display:block;font-size:13px;color:#c7c9cd;margin-bottom:12px}
    .input-row{display:flex;gap:10px}
    input{flex:1;min-width:0;background:#111317;border:1px solid #30333a;border-radius:9px;color:#fff;padding:19px 18px;font:inherit;font-size:15px;outline:none}
    input:focus{border-color:#999da5;box-shadow:0 0 0 3px #ffffff12}input::placeholder{color:#696d75}
    button{border:0;border-radius:9px;background:#f0f1f0;color:#101115;padding:0 25px;font:inherit;font-weight:650;cursor:pointer;white-space:nowrap}
    button:hover{background:#fff}button:disabled{opacity:.55;cursor:wait}
    .hint{color:#777c84;font-size:12px;margin:14px 0 0}
    .status{min-height:24px;margin:20px 0 0;font-size:13px;color:#e7b4ad}
    .result{margin-top:12px;padding:22px;border:1px solid #30333a;background:#111317;border-radius:12px}
    .result[hidden]{display:none}.result-label{color:#92969e;font-size:12px;margin:0 0 12px}
    .result-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .result a{color:#fff;text-decoration:none;font-size:clamp(16px,3vw,23px);letter-spacing:-.025em;overflow-wrap:anywhere}
    .copy{padding:12px 16px;border:1px solid #51545b;background:transparent;color:#fff;font-size:13px}.copy:hover{background:#23252a}
    .expiry{color:#777c84;font-size:12px;margin:16px 0 0}
    @media(max-width:620px){.input-row{flex-direction:column}.input-row button{min-height:52px}.result-row{align-items:flex-start;flex-direction:column}.copy{width:100%}main{padding:70px 0}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">YOITES</a><a class="back" href="/">Voltar ao site ↗</a></header>
  <main>
    <p class="eyebrow">Ferramenta / 01</p>
    <h1>Links curtos.<br>Tempo certo.</h1>
    <p class="intro">Cole um endereço e receba um link curto que desaparece automaticamente após 10 minutos.</p>
    <form id="form">
      <label for="url">URL original</label>
      <div class="input-row"><input id="url" name="url" type="url" inputmode="url" placeholder="https://exemplo.com/pagina" autocomplete="url" required maxlength="2048"><button id="submit" type="submit">Encurtar link</button></div>
      <p class="hint">Aceita links HTTP e HTTPS. Cada link dura 10 minutos.</p>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="result" class="result" aria-label="Link encurtado" hidden>
      <p class="result-label">SEU LINK</p>
      <div class="result-row"><a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a><button id="copy" class="copy" type="button">Copiar link</button></div>
      <p id="expiry" class="expiry"></p>
    </section>
  </main>
  <footer><span>© YOITES</span><span>Simples. Temporário.</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
