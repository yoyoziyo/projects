<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a18">
  <meta name="description" content="Portal oficial da Outfits Central. Descubra nossos jogos e participe da comunidade no Roblox.">
  <meta property="og:title" content="Outfits Central">
  <meta property="og:description" content="Explore universos, encontre seu estilo e acesse a comunidade oficial da Outfits Central.">
  <meta property="og:image" content="https://yoites.com/outfitscentral/assets/images/outfits-central-cover.webp">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yoites.com/outfitscentral/">
  <title>Outfits Central</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="scene" aria-hidden="true">
    <div class="scene__glow scene__glow--gold"></div>
    <div class="scene__glow scene__glow--blue"></div>
    <div class="scene__grid"></div>
  </div>

  <main class="profile-shell">
    <section class="profile-card" aria-labelledby="page-title">
      <div class="profile-card__art" aria-hidden="true">
        <img src="assets/images/outfits-central-cover.webp" alt="">
      </div>
      <div class="profile-card__shine" aria-hidden="true"></div>

      <header class="hero">
        <div class="status-pill">
          <span class="status-pill__dot"></span>
          Portal oficial
        </div>

        <div class="brand-mark" aria-hidden="true">
          <span class="brand-mark__orbit brand-mark__orbit--outer"></span>
          <span class="brand-mark__orbit brand-mark__orbit--inner"></span>
          <img src="assets/images/outfits-central-logo.webp" alt="">
        </div>

        <p class="eyebrow">ROBLOX EXPERIENCE NETWORK</p>
        <h1 id="page-title">Outfits Central</h1>
        <p class="hero__copy">Explore novos universos. Encontre seu estilo.</p>

        <div class="hero__tags" aria-label="Destaques">
          <span>Outfits</span>
          <i aria-hidden="true"></i>
          <span>Experiências</span>
          <i aria-hidden="true"></i>
          <span>Comunidade</span>
        </div>
      </header>

      <nav class="link-list" aria-label="Links oficiais da Outfits Central">
        <a class="link-card link-card--featured" data-link="hub" href="#" target="_blank" rel="noopener noreferrer">
          <span class="link-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8.6 3.5 20.5 8.6l-5.1 11.9L3.5 15.4 8.6 3.5Z" stroke="currentColor" stroke-width="1.8"/><path d="m10.5 9.1 4.4 1.9-1.9 4.4-4.4-1.9 1.9-4.4Z" fill="currentColor"/></svg>
          </span>
          <span class="link-card__content">
            <small>JOGUE AGORA</small>
            <strong>Outfits Central <em>[OC]</em></strong>
            <span>Todos os nossos mundos em um só lugar</span>
          </span>
          <span class="link-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>

        <a class="link-card" data-link="community" href="#" target="_blank" rel="noopener noreferrer">
          <span class="link-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM15.8 10a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM3 19a5.5 5.5 0 0 1 11 0M13 14.1A5 5 0 0 1 21 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <span class="link-card__content">
            <small>ROBLOX</small>
            <strong>Comunidade Oficial</strong>
            <span>Faça parte da Outfits Central</span>
          </span>
          <span class="link-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      </nav>

      <footer class="footer">
        <span class="footer__line"></span>
        <p><span>OC</span> · Built for every universe</p>
        <span class="footer__line"></span>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/script.js" defer></script>
</body>
</html>
